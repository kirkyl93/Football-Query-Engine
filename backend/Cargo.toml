[package]
name = "football_game"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4"
actix-cors = "0"
dotenv = "0.15"
sqlx = { version = "0", features = ["runtime-async-std", "postgres", "chrono"] }
chrono = { version = "0", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0"
log = "0"
env_logger = "0"
# Already in the tree via actix-web; sync for the cache, macros/time for tests.
tokio = { version = "1", features = ["sync", "macros", "time"] }